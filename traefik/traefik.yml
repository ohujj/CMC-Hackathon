entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: true # cloudflared가 보낸 X-Forwarded-Proto: https 신뢰

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: cmc-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
