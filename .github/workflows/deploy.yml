name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 빌드
        run: ./gradlew clean build

      - name: Docker Hub 로그인
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker 이미지 빌드 및 push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cmc-hackerton .
          docker push ${{ secrets.DOCKER_USERNAME }}/cmc-hackerton

      - name: EC2 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/cmc-hackerton
            docker stop cmc-hackerton || true
            docker rm cmc-hackerton || true
            docker run -d --name cmc-hackerton -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/cmc-hackerton