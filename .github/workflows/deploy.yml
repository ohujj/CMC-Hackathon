name: Deploy to EC2

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.db.yml"
      - "docker-compose.blue.yml"
      - "docker-compose.green.yml"
      - "traefik/traefik.yml"
      - "scripts/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JDK 21 세팅
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle 빌드
        run: ./gradlew clean build

      - name: Docker Hub 로그인
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker 이미지 빌드 및 push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cmc-hackathon .
          docker push ${{ secrets.DOCKER_USERNAME }}/cmc-hackathon

      - name: EC2 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/CMC-Hackathon

            # dynamic.yml은 gitignore 대상 — git reset 전 현재 슬롯 보존
            ACTIVE_SLOT=$(grep -oE 'cmc-hackathon-(blue|green)' traefik/dynamic.yml 2>/dev/null | head -1 || echo "cmc-hackathon-blue")

            git fetch origin
            git reset --hard origin/main

            # dynamic.yml이 없으면 (최초 배포) 초기값으로 생성
            if [ ! -f traefik/dynamic.yml ]; then
              cat > traefik/dynamic.yml <<DYNEOF
            http:
              routers:
                app:
                  rule: "PathPrefix(\`/\`)"
                  entryPoints: ["web"]
                  service: app-active
              services:
                app-active:
                  loadBalancer:
                    servers:
                      - url: "http://${ACTIVE_SLOT}:8080"
                    healthCheck:
                      path: "/health"
                      interval: "5s"
                      timeout: "2s"
            DYNEOF
            fi

            chmod +x scripts/deploy.sh scripts/migrate.sh
            bash scripts/deploy.sh
