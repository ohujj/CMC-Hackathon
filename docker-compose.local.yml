services:
  db:
    image: mysql:8.0
    container_name: cmc-mysql-local
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: indiefilm
      TZ: Asia/Seoul
    volumes:
      - mysql-local-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-local-data:
